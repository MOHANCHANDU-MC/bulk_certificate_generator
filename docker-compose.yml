services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certificate_generator_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Bulk Certificate Generator API
      - APP_VERSION=1.0.0
      - DEBUG=false
      - BASE_URL=http://localhost:8000
      - DATABASE_URL=sqlite:////app/data/certificates.db
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
